[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-location-restaurant-integration-lab"
version = "0.1.0"
description = "Executable lab for testing technical reuse, integration complexity, and delivery economics across a fictional multi-location restaurant group."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
restaurant-integration-lab = "restaurant_integration_lab.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

